<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - V2</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #111; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .panel { background: #222; padding: 25px; border-radius: 8px; width: 100%; max-width: 600px; border-top: 4px solid #ffc107; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1, h3 { color: #ffc107; text-align: center; margin-top: 0; }
        .control-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; background: #2a2a2a; padding: 15px; border-radius: 5px; }
        label { font-size: 0.9rem; color: #aaa; }
        input[type="text"], input[type="file"], select, button { padding: 10px; border-radius: 4px; border: none; font-size: 1rem; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-item { display: flex; align-items: center; gap: 5px; background: #333; padding: 5px; border-radius: 4px; }
        .option-item input[type="text"] { flex: 1; }
        .btn-row { display: flex; gap: 10px; }
        button { flex: 1; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-primary { background-color: #ffc107; color: #000; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-nav { background-color: #444; color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #playlistDisplay { font-size: 0.9rem; color: #aaa; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>🛠️ Control V2</h1>
        
        <div class="control-group">
            <label>1. Agregar Pregunta (Auto-compresión a 600px)</label>
            <input type="file" id="imageInput" accept="image/*">
            <div class="options-grid">
                <div class="option-item"><input type="radio" name="correcta" value="0" checked> <input type="text" id="opt0" placeholder="Opción 1"></div>
                <div class="option-item"><input type="radio" name="correcta" value="1"> <input type="text" id="opt1" placeholder="Opción 2"></div>
                <div class="option-item"><input type="radio" name="correcta" value="2"> <input type="text" id="opt2" placeholder="Opción 3"></div>
                <div class="option-item"><input type="radio" name="correcta" value="3"> <input type="text" id="opt3" placeholder="Opción 4"></div>
            </div>
            <button id="btnAdd" class="btn-primary">Guardar en Playlist</button>
            <div id="playlistDisplay">Preguntas cargadas: 0</div>
        </div>

        <div class="control-group">
            <label>2. Navegación</label>
            <div class="btn-row">
                <button class="btn-nav" id="btnPrev" disabled>⏮ Anterior</button>
                <button class="btn-nav" id="btnNext" disabled>Siguiente ⏭</button>
            </div>
        </div>

        <div class="control-group">
            <label>3. Controles en Vivo</label>
            <div class="btn-row">
                <select id="timeSelect">
                    <option value="15">15 Segundos</option>
                    <option value="30" selected>30 Segundos</option>
                </select>
                <select id="gridSelect">
                    <option value="4" selected>Grilla: 4x4</option>
                    <option value="6">Grilla: 6x6</option>
                </select>
            </div>
            <div class="btn-row" style="margin-top:10px;">
                <button id="btnStart" class="btn-primary" disabled>▶ Lanzar Pregunta</button>
                <button id="btnReveal" class="btn-danger" disabled>👁️ Revelar</button>
                <button id="btnRanking" class="btn-nav">🏆 Ver Ranking</button>
            </div>
            <div style="margin-top:10px;">
                <button id="btnResetPlayers" class="btn-danger" style="width:100%; background:#8b0000;">Borrar Jugadores (Nueva Sala)</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, update } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUDLHNHmourA_rDwa01-GUkqE06mE6hfs",
            authDomain: "celebrity-baby-35179.firebaseapp.com",
            databaseURL: "https://celebrity-baby-35179-default-rtdb.firebaseio.com",
            projectId: "celebrity-baby-35179",
            storageBucket: "celebrity-baby-35179.firebasestorage.app",
            messagingSenderId: "830846373781",
            appId: "1:830846373781:web:eaa35b292754152d07b09c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gameRef = ref(db, 'activacion_adivina_personaje');

        let playlist = [];
        let currentIndex = -1;
        let intervalId;
        let availableBlocks = [];
        let revealedBlocks = [];

        // Compresión de imagen
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 600;
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.6)); // 60% calidad JPG
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('btnAdd').onclick = () => {
            const file = document.getElementById('imageInput').files[0];
            const opts = [
                document.getElementById('opt0').value, document.getElementById('opt1').value,
                document.getElementById('opt2').value, document.getElementById('opt3').value
            ];
            const correcta = parseInt(document.querySelector('input[name="correcta"]:checked').value);
            
            if(!file || opts.includes("")) { alert("Faltan datos"); return; }

            compressImage(file, (base64Img) => {
                playlist.push({ image: base64Img, opciones: opts, correcta: correcta });
                document.getElementById('playlistDisplay').innerText = `Preguntas cargadas: ${playlist.length}`;
                document.getElementById('imageInput').value = '';
                if(currentIndex === -1) { currentIndex = 0; syncToScreen(); }
                updateUI();
            });
        };

        function updateUI() {
            document.getElementById('btnPrev').disabled = currentIndex <= 0;
            document.getElementById('btnNext').disabled = currentIndex >= playlist.length - 1;
            document.getElementById('btnStart').disabled = playlist.length === 0;
        }

        document.getElementById('btnNext').onclick = () => { if(currentIndex < playlist.length - 1) { currentIndex++; syncToScreen(); } };
        document.getElementById('btnPrev').onclick = () => { if(currentIndex > 0) { currentIndex--; syncToScreen(); } };

        function syncToScreen() {
            clearInterval(intervalId);
            const gridSize = parseInt(document.getElementById('gridSelect').value);
            availableBlocks = Array.from({length: gridSize*gridSize}, (_, i) => i);
            revealedBlocks = [];

            update(gameRef, {
                estado: 'idle',
                pregunta_actual: {
                    ...playlist[currentIndex],
                    gridSize: gridSize,
                    revealedBlocks: []
                }
            });
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnReveal').disabled = true;
            updateUI();
        }

        document.getElementById('btnStart').onclick = () => {
            const totalTimeSecs = parseInt(document.getElementById('timeSelect').value);
            const gridSize = parseInt(document.getElementById('gridSelect').value);
            
            update(gameRef, { 
                estado: 'playing',
                'pregunta_actual/startTime': Date.now(),
                'pregunta_actual/totalTimeSecs': totalTimeSecs
            });

            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnReveal').disabled = false;

            const intervalTime = (totalTimeSecs * 1000) / (gridSize*gridSize);
            intervalId = setInterval(() => {
                if (availableBlocks.length === 0) { clearInterval(intervalId); return; }
                const randIdx = Math.floor(Math.random() * availableBlocks.length);
                revealedBlocks.push(availableBlocks.splice(randIdx, 1)[0]);
                update(ref(db, 'activacion_adivina_personaje/pregunta_actual'), { revealedBlocks: revealedBlocks });
            }, intervalTime);
        };

        document.getElementById('btnReveal').onclick = () => {
            clearInterval(intervalId);
            update(gameRef, { estado: 'revealed' });
            document.getElementById('btnReveal').disabled = true;
        };

        document.getElementById('btnRanking').onclick = () => {
            clearInterval(intervalId);
            update(gameRef, { estado: 'ranking' });
        };

        document.getElementById('btnResetPlayers').onclick = () => {
            if(confirm("¿Borrar todos los jugadores y puntajes?")) {
                set(ref(db, 'activacion_adivina_personaje/jugadores'), null);
            }
        };
    </script>
</body>
</html>
