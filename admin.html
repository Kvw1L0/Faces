<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Arcade V3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body { font-family: 'Press Start 2P', monospace; background-color: #000; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; font-size: 12px; line-height: 1.5; }
        .panel { background: #111; padding: 25px; width: 100%; max-width: 700px; border: 4px solid #ffc107; box-shadow: 8px 8px 0px rgba(255,193,7,0.3); }
        h1, h3 { color: #ffc107; text-align: center; margin-top: 0; text-shadow: 2px 2px #d32f2f; }
        
        .control-group { margin-bottom: 25px; border: 2px dashed #444; padding: 15px; }
        label { color: #aaa; display: block; margin-bottom: 10px; font-size: 10px; }
        
        input[type="text"], input[type="file"], select, button { 
            font-family: 'Press Start 2P', monospace; padding: 12px; font-size: 10px; 
            border: 2px solid #fff; background: #000; color: #fff; outline: none;
        }
        
        .btn-arcade { cursor: pointer; text-transform: uppercase; border: 2px solid #fff; box-shadow: 4px 4px 0px #fff; transition: 0.1s; font-weight: bold; }
        .btn-arcade:active:not(:disabled) { box-shadow: 0px 0px 0px #fff; transform: translate(4px, 4px); }
        .btn-primary { background-color: #ffc107; color: #000; border-color: #ffc107; box-shadow: 4px 4px 0px #d32f2f; }
        .btn-primary:active:not(:disabled) { box-shadow: 0px 0px 0px #d32f2f; }
        .btn-danger { background-color: #d32f2f; border-color: #ff5252; box-shadow: 4px 4px 0px #8b0000; }
        .btn-arcade:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .option-item { display: flex; align-items: center; gap: 10px; }
        .option-item input[type="text"] { width: 100%; }
        .btn-row { display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
        .btn-row > * { flex: 1; min-width: 150px; }
        
        #room-status { font-size: 16px; color: #00e676; text-align: center; margin-bottom: 20px; display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>ARCADE ADMIN</h1>
        
        <!-- CONTROL DE SALA -->
        <div class="control-group" id="room-controls">
            <button id="btnCreateRoom" class="btn-arcade btn-primary" style="width:100%; padding: 20px;">[ INICIAR NUEVA SALA ]</button>
        </div>
        
        <div id="room-status">SALA ACTIVA: <span id="pinDisplay">----</span></div>

        <!-- CONTENIDO DEL JUEGO (Oculto hasta crear sala) -->
        <div id="game-controls" class="hidden">
            <div class="control-group">
                <label>1. CARGAR PREGUNTA (AUTO-COMPRESIÓN)</label>
                <input type="file" id="imageInput" accept="image/*" style="width: 100%; margin-bottom:15px;">
                <div class="options-grid">
                    <div class="option-item"><input type="radio" name="correcta" value="0" checked> <input type="text" id="opt0" placeholder="OPT 1"></div>
                    <div class="option-item"><input type="radio" name="correcta" value="1"> <input type="text" id="opt1" placeholder="OPT 2"></div>
                    <div class="option-item"><input type="radio" name="correcta" value="2"> <input type="text" id="opt2" placeholder="OPT 3"></div>
                    <div class="option-item"><input type="radio" name="correcta" value="3"> <input type="text" id="opt3" placeholder="OPT 4"></div>
                </div>
                <button id="btnAdd" class="btn-arcade" style="width:100%">GUARDAR EN PLAYLIST</button>
                <div id="playlistDisplay" style="text-align: center; margin-top: 10px; color:#aaa;">PREGUNTAS: 0</div>
            </div>

            <div class="control-group">
                <label>2. NAVEGACIÓN PLAYLIST</label>
                <div class="btn-row">
                    <button class="btn-arcade" id="btnPrev" disabled>< ANTERIOR</button>
                    <button class="btn-arcade" id="btnNext" disabled>SIGUIENTE ></button>
                </div>
            </div>

            <div class="control-group">
                <label>3. CONTROLES EN VIVO</label>
                <div class="btn-row">
                    <select id="timeSelect">
                        <option value="15">15 SEG</option>
                        <option value="30" selected>30 SEG</option>
                    </select>
                    <select id="gridSelect">
                        <option value="4" selected>GRILLA: 4x4</option>
                        <option value="6">GRILLA: 6x6</option>
                    </select>
                </div>
                <div class="btn-row">
                    <button id="btnStart" class="btn-arcade btn-primary" disabled>LANZAR PREGUNTA</button>
                    <button id="btnReveal" class="btn-arcade btn-danger" disabled>REVELAR</button>
                </div>
                <div class="btn-row">
                    <button id="btnLobby" class="btn-arcade">VER LOBBY</button>
                    <button id="btnRanking" class="btn-arcade">VER RANKING</button>
                </div>
                <button id="btnCloseRoom" class="btn-arcade btn-danger" style="width:100%; margin-top:15px;">CERRAR SALA DEFINITIVO</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, update, get } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyBUDLHNHmourA_rDwa01-GUkqE06mE6hfs", authDomain: "celebrity-baby-35179.firebaseapp.com", databaseURL: "https://celebrity-baby-35179-default-rtdb.firebaseio.com", projectId: "celebrity-baby-35179" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let currentPIN = null;
        let roomRef = null;
        let playlist = [];
        let currentIndex = -1;
        let intervalId;
        let availableBlocks = [];
        let revealedBlocks = [];

        // 1. Crear Sala
        document.getElementById('btnCreateRoom').onclick = () => {
            currentPIN = Math.floor(1000 + Math.random() * 9000).toString(); // PIN 4 dígitos
            roomRef = ref(db, `activacion_arcade/salas/${currentPIN}`);
            
            // Configurar sala y notificar a la pantalla gigante
            set(roomRef, { estado: 'lobby', creador: Date.now() });
            set(ref(db, 'activacion_arcade/sala_activa'), currentPIN);
            
            document.getElementById('room-controls').classList.add('hidden');
            document.getElementById('game-controls').classList.remove('hidden');
            document.getElementById('room-status').style.display = 'block';
            document.getElementById('pinDisplay').innerText = currentPIN;
        };

        document.getElementById('btnCloseRoom').onclick = () => {
            if(confirm("¿Cerrar sala y expulsar jugadores?")) {
                set(roomRef, null);
                set(ref(db, 'activacion_arcade/sala_activa'), null);
                location.reload();
            }
        };

        // Compresión de imagen
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 600; let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.6));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('btnAdd').onclick = () => {
            const file = document.getElementById('imageInput').files[0];
            const opts = [
                document.getElementById('opt0').value, document.getElementById('opt1').value,
                document.getElementById('opt2').value, document.getElementById('opt3').value
            ];
            const correcta = parseInt(document.querySelector('input[name="correcta"]:checked').value);
            
            if(!file || opts.includes("")) { alert("Faltan datos"); return; }

            compressImage(file, (base64Img) => {
                playlist.push({ image: base64Img, opciones: opts, correcta: correcta });
                document.getElementById('playlistDisplay').innerText = `PREGUNTAS: ${playlist.length}`;
                document.getElementById('imageInput').value = '';
                if(currentIndex === -1) { currentIndex = 0; syncToScreen(); }
                updateUI();
            });
        };

        function updateUI() {
            document.getElementById('btnPrev').disabled = currentIndex <= 0;
            document.getElementById('btnNext').disabled = currentIndex >= playlist.length - 1;
            document.getElementById('btnStart').disabled = playlist.length === 0;
        }

        document.getElementById('btnNext').onclick = () => { if(currentIndex < playlist.length-1) { currentIndex++; syncToScreen(); } };
        document.getElementById('btnPrev').onclick = () => { if(currentIndex > 0) { currentIndex--; syncToScreen(); } };

        function syncToScreen() {
            clearInterval(intervalId);
            const size = parseInt(document.getElementById('gridSelect').value);
            availableBlocks = Array.from({length: size*size}, (_, i) => i);
            revealedBlocks = [];

            update(roomRef, {
                estado: 'idle',
                pregunta_actual: { ...playlist[currentIndex], gridSize: size, revealedBlocks: [] }
            });
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnReveal').disabled = true;
            updateUI();
        }

        document.getElementById('btnStart').onclick = () => {
            const time = parseInt(document.getElementById('timeSelect').value);
            const size = parseInt(document.getElementById('gridSelect').value);
            
            update(roomRef, { estado: 'playing', 'pregunta_actual/startTime': Date.now(), 'pregunta_actual/totalTimeSecs': time });
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnReveal').disabled = false;

            const interval = (time * 1000) / (size*size);
            intervalId = setInterval(() => {
                if (availableBlocks.length === 0) { clearInterval(intervalId); return; }
                const rand = Math.floor(Math.random() * availableBlocks.length);
                revealedBlocks.push(availableBlocks.splice(rand, 1)[0]);
                update(ref(db, `activacion_arcade/salas/${currentPIN}/pregunta_actual`), { revealedBlocks: revealedBlocks });
            }, interval);
        };

        document.getElementById('btnReveal').onclick = () => { clearInterval(intervalId); update(roomRef, { estado: 'revealed' }); document.getElementById('btnReveal').disabled = true; };
        document.getElementById('btnRanking').onclick = () => { clearInterval(intervalId); update(roomRef, { estado: 'ranking' }); };
        document.getElementById('btnLobby').onclick = () => { clearInterval(intervalId); update(roomRef, { estado: 'lobby' }); };
    </script>
</body>
</html>
