<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jugar - BTL Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Press Start 2P', monospace; display: flex; flex-direction: column; align-items: center; background-color: #000; overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; }
        
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('fondo.png'); background-size: cover; background-position: center; z-index: -2; opacity: 0.3; }
        
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; z-index: 1;}
        .active { display: flex; }

        /* BLINDAJE iOS */
        #login-screen input { width: 100%; max-width: 300px; padding: 15px; font-size: 16px; text-align: center; border: 4px solid #fff; background: rgba(0,0,0,0.8); color: #fff; margin-bottom: 20px; font-family: 'Press Start 2P', monospace; text-transform: uppercase; border-radius: 0; -webkit-appearance: none;}
        .btn-action { background: #E3000f; color: #fff; font-size: 16px; padding: 20px; border: 4px solid #fff; cursor: pointer; text-transform: uppercase; font-family: 'Press Start 2P', monospace; width: 100%; max-width: 300px; transition: 0.1s; touch-action: manipulation; -webkit-tap-highlight-color: transparent;}
        .btn-action:active { transform: scale(0.95); background: #fff; color: #E3000f;}

        #mini-game-container { position: relative; width: 100%; max-width: 250px; aspect-ratio: 1/1; border: 4px solid #fff; margin-bottom: 20px; background: #000; box-shadow: 0 0 20px rgba(227,0,15,0.5);}
        #mini-target-image { width: 100%; height: 100%; object-fit: contain; }
        #mini-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; }
        .grid-block { background-color: #E3000f; border: 1px solid #fff; transition: opacity 0.2s; }
        .grid-block.hidden { opacity: 0; }

        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 400px; }
        .btn-option { background: rgba(0,0,0,0.8); color: #fff; padding: 20px 10px; font-size: 12px; border: 4px solid #fff; cursor: pointer; word-wrap: break-word; font-family: 'Press Start 2P', monospace; transition: 0.1s; touch-action: manipulation; -webkit-tap-highlight-color: transparent;}
        .btn-option.selected { background: #fff; color: #E3000f; border-color: #E3000f; transform: scale(1.05); }

        #result-screen { text-align: center; }
        #res-title { font-size: 24px; text-shadow: 2px 2px #000; line-height: 1.5; color: #fff;}
        #res-subtitle { font-size: 16px; margin-top: 20px; color: #fff;}

        #score-display { position: absolute; top: 15px; right: 15px; font-size: 12px; color: #fff; background: #E3000f; padding: 10px; border: 2px solid #fff; z-index: 100;}
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <div id="score-display" style="display:none;">0 PTS</div>

    <div id="login-screen" class="screen active">
        <h1 style="color:#fff; margin-bottom: 30px; text-shadow: 4px 4px #E3000f; text-align: center;">ÚNETE</h1>
        <input type="text" id="pinInput" placeholder="PIN SALA" maxlength="4" pattern="[0-9]*" inputmode="numeric">
        <input type="text" id="nickname" placeholder="NICKNAME" maxlength="12">
        <button class="btn-action" id="btnJoin">ENTRAR</button>
    </div>

    <div id="game-screen" class="screen">
        <!-- Texto limpio. Sin instrucciones invasivas -->
        <div id="game-status-text" style="color:#fff; font-size: 12px; margin-bottom: 15px; text-align: center; line-height: 1.5; background: #E3000f; padding: 10px; border: 2px solid #fff; opacity:0;">...</div>
        
        <div id="mini-game-container" style="display:none;">
            <img id="mini-target-image" src="" alt="">
            <div id="mini-grid"></div>
        </div>
        <div class="options-container" id="options-container" style="display:none;">
            <button class="btn-option" id="btnOpt0">OPT 1</button>
            <button class="btn-option" id="btnOpt1">OPT 2</button>
            <button class="btn-option" id="btnOpt2">OPT 3</button>
            <button class="btn-option" id="btnOpt3">OPT 4</button>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h1 id="res-title">...</h1>
        <p id="res-subtitle">...</p>
    </div>

    <script type="module">
        // @ts-ignore
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        // @ts-ignore
        import { getDatabase, ref, onValue, set, get, child, update } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBUDLHNHmourA_rDwa01-GUkqE06mE6hfs", 
            authDomain: "celebrity-baby-35179.firebaseapp.com", 
            databaseURL: "https://celebrity-baby-35179-default-rtdb.firebaseio.com", 
            projectId: "celebrity-baby-35179" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentRoom = sessionStorage.getItem('btl_room'); 
        let playerId = sessionStorage.getItem('btl_id'); 
        let playerName = sessionStorage.getItem('btl_name');
        let currentScore = 0; 
        
        let localSelectedOption = -1; 
        let localSelectedTimestamp = 0;
        let pointsEarnedRound = 0;
        let questionProcessed = false;
        
        // BANDERA DE BLOQUEO: Cuando el tiempo termina, pasa a false.
        let canAnswer = false; 

        const screens = { login: document.getElementById('login-screen'), game: document.getElementById('game-screen'), result: document.getElementById('result-screen') };
        function showScreen(name) { Object.values(screens).forEach(s => s.classList.remove('active')); screens[name].classList.add('active'); }

        if (playerId && currentRoom) { 
            document.getElementById('score-display').style.display = 'block'; listenToGame(); listenToMyScore(); 
        }

        document.getElementById('btnJoin').onclick = () => {
            const pin = document.getElementById('pinInput').value.trim(); const nick = document.getElementById('nickname').value.trim().toUpperCase();
            if (pin.length < 4 || nick.length < 2) { alert("DATOS INVÁLIDOS"); return; }
            
            get(child(ref(db), `activacion_arcade/salas/${pin}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    playerId = 'p_' + Math.random().toString(36).substr(2, 6); 
                    playerName = nick; currentRoom = pin;
                    sessionStorage.setItem('btl_room', pin); sessionStorage.setItem('btl_id', playerId); sessionStorage.setItem('btl_name', playerName);
                    set(ref(db, `activacion_arcade/salas/${pin}/jugadores/${playerId}`), { nombre: playerName, puntaje: 0 });
                    document.getElementById('score-display').style.display = 'block'; listenToGame(); listenToMyScore();
                } else { alert("SALA NO ENCONTRADA"); }
            });
        };

        function listenToMyScore() {
            onValue(ref(db, `activacion_arcade/salas/${currentRoom}/jugadores/${playerId}/puntaje`), (snap) => {
                currentScore = snap.val() || 0; document.getElementById('score-display').innerText = `${currentScore} PTS`;
            });
        }

        let currentBlocks = [];
        
        function listenToGame() {
            onValue(ref(db, `activacion_arcade/salas/${currentRoom}`), (snapshot) => {
                const data = snapshot.val(); 
                if (!data) { sessionStorage.clear(); location.reload(); return; }
                
                const e = data.estado; 
                const preg = data.pregunta_actual;

                if (e === 'lobby' || e === 'idle') {
                    showScreen('game'); 
                    document.getElementById('game-status-text').style.opacity = e === 'lobby' ? '1' : '0';
                    document.getElementById('game-status-text').innerText = "ESPERANDO...";
                    
                    document.getElementById('mini-game-container').style.display = 'none'; 
                    document.getElementById('options-container').style.display = 'none';
                    
                    localSelectedOption = -1; 
                    questionProcessed = false;
                    canAnswer = true; // Habilita interacción
                    
                    if (preg && e === 'idle') {
                        if (document.getElementById('mini-target-image').src !== preg.image) {
                            document.getElementById('mini-target-image').src = preg.image;
                            const grid = document.getElementById('mini-grid');
                            grid.style.gridTemplateColumns = `repeat(${preg.gridSize}, 1fr)`; grid.style.gridTemplateRows = `repeat(${preg.gridSize}, 1fr)`;
                            grid.innerHTML = ''; currentBlocks = [];
                            for (let i = 0; i < preg.gridSize * preg.gridSize; i++) {
                                const b = document.createElement('div'); b.className = 'grid-block'; grid.appendChild(b); currentBlocks.push(b);
                            }
                        }
                        
                        for (let i = 0; i < 4; i++) {
                            const btn = document.getElementById(`btnOpt${i}`); btn.innerText = preg.opciones[i]; btn.classList.remove('selected');
                            
                            btn.onclick = () => {
                                // BLOQUEO: Si el servidor ya corto el tiempo, ignora clics.
                                if(!canAnswer) return; 

                                localSelectedOption = i;
                                localSelectedTimestamp = Date.now(); 
                                
                                for (let j = 0; j < 4; j++) { document.getElementById(`btnOpt${j}`).classList.remove('selected'); }
                                btn.classList.add('selected');
                                
                                document.body.style.backgroundColor = "#fff"; setTimeout(() => document.body.style.backgroundColor = "#000", 50);
                                if (navigator.vibrate) navigator.vibrate(50); 
                            };
                        }
                    }
                } 
                else if (e === 'playing') {
                    showScreen('game');
                    document.getElementById('game-status-text').style.opacity = '0';
                    document.getElementById('mini-game-container').style.display = 'block'; 
                    document.getElementById('options-container').style.display = 'grid';
                    
                    const revealed = preg.revealedBlocks || [];
                    revealed.forEach(idx => { if (currentBlocks[idx]) currentBlocks[idx].classList.add('hidden'); });
                }
                else if (e === 'revealed') {
                    // CORTA EL INGRESO DE RESPUESTAS INMEDIATAMENTE
                    canAnswer = false; 

                    showScreen('result'); const scr = screens.result;
                    
                    if (!questionProcessed) {
                        questionProcessed = true;
                        
                        if (localSelectedOption === -1) {
                            scr.style.backgroundColor = "#333";
                            document.getElementById('res-title').innerText = "TIEMPO AGOTADO"; document.getElementById('res-subtitle').innerText = "NO RESPONDISTE";
                            if (navigator.vibrate) navigator.vibrate([200]);
                        } else if (localSelectedOption === preg.correcta) {
                            scr.style.backgroundColor = "#00c853"; 
                            
                            const timeTaken = localSelectedTimestamp - preg.startTime;
                            const maxTime = preg.totalTimeSecs * 1000;
                            let score = Math.floor(1000 * (1 - (timeTaken / maxTime)));
                            if (score < 100) score = 100; if (timeTaken > maxTime || timeTaken < 0) score = 0;
                            pointsEarnedRound = parseInt(score) || 0; 
                            
                            document.getElementById('res-title').innerText = "CORRECTO"; document.getElementById('res-subtitle').innerText = `+${pointsEarnedRound} PTS`;
                            update(ref(db, `activacion_arcade/salas/${currentRoom}/jugadores/${playerId}`), { puntaje: currentScore + pointsEarnedRound });
                            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
                        } else {
                            scr.style.backgroundColor = "#E3000f"; 
                            document.getElementById('res-title').innerText = "INCORRECTO"; document.getElementById('res-subtitle').innerText = "0 PTS";
                            if (navigator.vibrate) navigator.vibrate([300]);
                        }
                    }
                }
                else if (e === 'ranking') {
                    canAnswer = false;
                    showScreen('result'); screens.result.style.backgroundColor = "transparent";
                    document.getElementById('res-title').innerText = "MIRA LA PANTALLA"; document.getElementById('res-subtitle').innerText = "TOP 20";
                }
            });
        }
    </script>
</body>
</html>
